<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src file:; media-src file:; style-src 'self'; script-src 'self'">
  <title>Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="stage"></div>
  <div id="idle" class="hidden">
    <div id="idle-title">Sem conteúdo para exibir</div>
    <div id="idle-detail"></div>
    <button id="idle-open" type="button">Abrir painel</button>
  </div>
  <pre id="debug" class="hidden"></pre>
  <button id="corner" type="button" aria-label="Painel de manutenção: segure para abrir">
    <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="25"></circle><circle class="fill" cx="28" cy="28" r="25"></circle></svg>
    <span class="gear">&#9881;</span>
  </button>
  <div id="winctl" class="hidden">
    <span class="title">Reprodutor Player</span>
    <button type="button" data-act="minimize" aria-label="Minimizar">&#8211;</button>
    <button type="button" data-act="window-toggle" aria-label="Tela cheia">&#9974;</button>
    <button type="button" data-act="quit" class="close" aria-label="Fechar o Player">&#10005;</button>
  </div>
  <div id="corner-hint" role="status">Segure por 1,5 segundo para abrir o painel</div>
  <div id="maint" class="hidden"></div>
  <script src="player.js"></script>
  <script src="vkb.js"></script>
  <script src="maintenance.js"></script>
</body>
</html>
