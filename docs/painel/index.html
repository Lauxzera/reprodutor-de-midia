<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src https: data: blob:; media-src https: blob:; connect-src https://*.backblazeb2.com https://api.github.com; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Painel web — Reprodutor de Mídia</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #14161a; overflow: auto; padding: 16px; }
    #gate[hidden] { display: none; }
    .gate-box { width: 100%; max-width: 440px; background: #1c1f26; border: 1px solid #2b303a; border-radius: 12px; padding: 24px; color: #e6e8ec; }
    .gate-box h1 { margin: 0 0 4px; font-size: 20px; }
    .gate-sub { margin: 0 0 16px; color: #9097a3; font-size: 14px; }
    .gate-field { display: block; margin-bottom: 12px; font-size: 13px; }
    .gate-field span { display: block; margin-bottom: 4px; color: #b7bdc8; }
    .gate-field small { display: block; margin-top: 4px; color: #7d8491; }
    .gate-field input[type=text], .gate-field input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 10px; background: #14161a; border: 1px solid #343a46; border-radius: 8px; color: #e6e8ec; font-size: 14px; }
    .gate-check { display: block; margin: 4px 0 12px; font-size: 13px; color: #b7bdc8; }
    .gate-btn { width: 100%; padding: 10px; background: #3b82f6; border: 0; border-radius: 8px; color: #fff; font-size: 15px; cursor: pointer; }
    .gate-btn:disabled { opacity: .6; cursor: wait; }
    .gate-link { display: block; margin: 14px auto 0; background: none; border: 0; color: #9097a3; font-size: 12px; text-decoration: underline; cursor: pointer; }
    .gate-msg { min-height: 18px; margin: 0 0 8px; color: #f87171; font-size: 13px; }
    .demo-banner { background: #92400e; color: #fff; text-align: center; padding: 6px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="gate" hidden></div>
  <header>
    <div class="brand">Reprodutor de Mídia</div>
    <nav id="tabs" aria-label="Seções do painel"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
